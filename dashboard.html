<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Workspace</title>
    
    <!-- CORE STYLING ENGINE: Loads the official Tailwind script directly into the browser -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex min-h-screen">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 border-r border-slate-900 p-6 hidden md:flex flex-col justify-between">
        <div class="space-y-8">
            <div class="text-lg font-bold text-white">Control Center</div>
            <nav class="flex flex-col gap-2 text-sm">
                <!-- CUSTOMIZATION: Add, remove, or modify your app's interior pages here -->
                <a href="#" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl font-medium">Overview</a>
                <a href="#" class="text-slate-400 hover:text-white px-4 py-2.5 rounded-xl transition-colors">Analytics</a>
                <a href="#" class="text-slate-400 hover:text-white px-4 py-2.5 rounded-xl transition-colors">Settings</a>
            </nav>
        </div>
        <div class="text-xs text-slate-500 border-t border-slate-900 pt-4">
            User: active_session_01
        </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 p-6 sm:p-10">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-white">Welcome back!</h1>
            <!-- INTEGRATION NOTE: Wire this up to clear user authentication cookies/tokens when clicked -->
            <button class="bg-slate-900 border border-slate-800 hover:border-slate-700 text-sm px-4 py-2 rounded-xl text-slate-300">Logout</button>
        </header>

        <!-- TELEMETRY / DATA GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <!-- CUSTOMIZATION: Change these metric values dynamically using Javascript database hooks -->
            <div class="bg-slate-900/40 border border-slate-800 p-6 rounded-2xl">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Operations</div>
                <div class="text-3xl font-bold text-white mt-1">1,248</div>
            </div>
            <div class="bg-slate-900/40 border border-slate-800 p-6 rounded-2xl">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Storage Limit</div>
                <div class="text-3xl font-bold text-white mt-1">84.2%</div>
            </div>
            <div class="bg-slate-900/40 border border-slate-800 p-6 rounded-2xl">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">API Health Status</div>
                <div class="text-3xl font-bold text-emerald-400 mt-1">Online</div>
            </div>
        </div>

        <!-- APPLICATION CONTAINER BOX -->
        <!-- CUSTOMIZATION: Delete this placeholder container and inject your core functional feature code here -->
        <div class="border-2 border-dashed border-slate-800 rounded-2xl p-12 text-center text-slate-500 text-sm">
            Your unique SaaS application tool logic, forms, or generator UI components go right inside this container block.
        </div>
    </main>

</body>
</html>
